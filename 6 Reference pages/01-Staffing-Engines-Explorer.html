<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Staffing Engines Explorer</title>
<style>
:root{
 --bg:#0c0f16;--grid:#161d2b;--surf:#151b27;--surf2:#1b2331;--surf3:#212b3c;
 --bd:#2a3547;--bd2:#3a495f;--tx:#e7ecf3;--mu:#8b98ad;--fa:#59647a;
 --agent:#33c3b4;--det:#5b8def;--human:#e9b552;--root:#ef5b52;--comp:#aeb9cd;
 --c1:#ef5b52;--c2:#2fb3a0;--c3:#f0954a;--buy:#a78bfa;--gap:#e9b552;--eng:#d38ce0;--new:#7bd88f;--chg:#e9b552;
 --link:#2f3c56;--linkHi:#54658a;
 --fd:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
 --fb:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --fm:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--fb);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;color:var(--tx)}
button{cursor:pointer}

/* top bar */
.top{position:fixed;top:0;left:0;right:0;height:52px;z-index:40;display:flex;align-items:center;gap:14px;
 padding:0 14px;background:rgba(12,15,22,.96);border-bottom:1px solid var(--bd);backdrop-filter:blur(8px)}
.brand{font-family:var(--fd);font-weight:700;font-size:14px;letter-spacing:-.01em;white-space:nowrap}
.tabs{display:flex;gap:3px;overflow-x:auto;flex:1;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:32px;padding:0 12px;border-radius:7px;border:1px solid transparent;background:transparent;
 font-size:12.5px;color:var(--mu);white-space:nowrap;transition:.14s}
.tab:hover{background:var(--surf2);color:var(--tx)}
.tab.on{background:var(--surf3);border-color:var(--bd2);color:#fff;font-weight:600}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px}
.srch{position:relative;flex-shrink:0}
.srch input{height:32px;width:190px;background:var(--surf);border:1px solid var(--bd);border-radius:7px;
 padding:0 10px 0 30px;font-size:12.5px;outline:none}
.srch input:focus{border-color:var(--agent);box-shadow:0 0 0 3px rgba(51,195,180,.12)}
.srch svg{position:absolute;left:9px;top:9px;width:13px;height:13px;fill:var(--fa)}
.iconbtn{width:32px;height:32px;border-radius:7px;border:1px solid var(--bd);background:var(--surf);
 display:grid;place-items:center;color:var(--mu);font-size:14px}
.iconbtn:hover{background:var(--surf2);color:var(--tx)}

/* sidebar */
.side{position:fixed;top:52px;left:0;bottom:0;width:262px;z-index:30;background:var(--surf);
 border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:transform .22s}
.side.hide{transform:translateX(-100%)}
.side .hd{padding:11px 14px 8px;font-family:var(--fm);font-size:9px;letter-spacing:.15em;
 text-transform:uppercase;color:var(--fa);border-bottom:1px solid var(--bd)}
.outline{flex:1;overflow:auto;padding:6px 0 16px}
.oi{display:block;width:100%;text-align:left;background:transparent;border:0;padding:5px 12px;
 font-size:12.5px;color:var(--mu);border-left:2px solid transparent;line-height:1.35}
.oi:hover{background:var(--surf2);color:var(--tx)}
.oi.on{background:var(--surf3);color:#fff;border-left-color:var(--agent)}
.oi .id{font-family:var(--fm);font-size:10px;margin-right:7px;opacity:.75}
.oi.l0{font-weight:600;color:var(--tx)}
.oi.l1{padding-left:20px}
.oi.l2{padding-left:36px;font-size:12px}
.oi .sw{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:6px}
.side .ft{padding:9px 13px;border-top:1px solid var(--bd);font-size:10.5px;color:var(--fa);line-height:1.6}
.side .ft b{color:var(--mu);font-weight:600}
kbd{font-family:var(--fm);font-size:9.5px;background:var(--surf3);border:1px solid var(--bd2);
 border-radius:3px;padding:1px 4px;color:var(--mu)}

/* canvas */
#stage{position:fixed;top:52px;left:262px;right:0;bottom:0;cursor:grab;touch-action:none;transition:left .22s}
#stage.wide{left:0}
#stage.drag{cursor:grabbing}
svg{width:100%;height:100%;display:block}
.node-g{cursor:pointer}
.node-g .card{transition:filter .16s,stroke .16s}
.node-g:hover .card{filter:brightness(1.1)}
.lbl{font-family:var(--fb);fill:var(--tx)}
.idt{font-family:var(--fm);font-size:10px;letter-spacing:.03em}
.tag{font-family:var(--fm);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase}
.note{font-family:var(--fb);fill:var(--mu)}
.colh{font-family:var(--fm);font-size:9.5px;letter-spacing:.2em;fill:var(--fa);text-transform:uppercase}
.link{fill:none;stroke:var(--link);stroke-width:1.4}
.badge circle{fill:var(--surf2);stroke:var(--bd2)}
.badge:hover circle{fill:var(--surf3)}
.cword{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* breadcrumb */
.crumb{position:fixed;top:60px;left:274px;z-index:25;font-size:11.5px;color:var(--fa);
 font-family:var(--fm);letter-spacing:.03em;pointer-events:none;transition:left .22s}
.crumb.wide{left:14px}
.crumb b{color:var(--mu);font-weight:400}

/* controls */
.ctl{position:fixed;right:14px;bottom:14px;z-index:22;display:flex;flex-direction:column;gap:7px;align-items:flex-end;
 transition:transform .26s}
body.panel-open .ctl{transform:translateX(-352px)}
.cluster{display:flex;background:var(--surf);border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.cluster button{width:36px;height:34px;background:transparent;border:0;border-left:1px solid var(--bd);
 display:grid;place-items:center;color:var(--mu);font-size:14px}
.cluster button:first-child{border-left:0}
.cluster button:hover{background:var(--surf2);color:var(--tx)}
.cluster .z{min-width:48px;font-family:var(--fm);font-size:11px;color:var(--mu);display:grid;place-items:center}
.cluster.wide button{width:auto;padding:0 11px;font-family:var(--fb);font-size:11.5px}

/* legend */
.leg{position:fixed;left:276px;bottom:14px;z-index:22;background:var(--surf);border:1px solid var(--bd);
 border-radius:9px;padding:9px 12px;font-size:11px;color:var(--mu);transition:left .22s}
.leg.wide{left:14px}
.leg .row{display:flex;align-items:center;gap:7px;margin:4px 0}
.leg b{color:var(--tx);font-weight:600}
.sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* panel */
.panel{position:fixed;top:52px;right:0;bottom:0;width:340px;z-index:35;background:var(--surf);
 border-left:1px solid var(--bd);box-shadow:-10px 0 40px rgba(0,0,0,.35);transform:translateX(100%);
 transition:transform .26s cubic-bezier(.4,0,.15,1);display:flex;flex-direction:column}
.panel.open{transform:none}
.panel .hd2{padding:16px 18px 13px;border-bottom:1px solid var(--bd)}
.panel .kind{font-family:var(--fm);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;display:inline-flex;align-items:center;gap:7px}
.panel .pid{font-family:var(--fm);font-size:10.5px;color:var(--fa);float:right}
.panel h2{font-family:var(--fd);font-weight:600;font-size:16px;margin:10px 0 0;line-height:1.32}
.panel .bd{padding:15px 18px;overflow:auto;font-size:12.5px;line-height:1.6}
.fld{margin-bottom:13px}
.fl{font-family:var(--fm);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--fa);margin-bottom:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;background:var(--surf2);
 border:1px solid var(--bd);font-size:11.5px}
.cl{position:absolute;top:13px;right:14px;width:25px;height:25px;border:0;background:transparent;color:var(--mu);
 font-size:16px;border-radius:6px}
.cl:hover{background:var(--surf2);color:var(--tx)}
.jump{display:block;width:100%;text-align:left;margin-top:5px;padding:6px 9px;border-radius:6px;
 background:var(--surf2);border:1px solid var(--bd);font-size:11.5px;color:var(--mu)}
.jump:hover{background:var(--surf3);color:var(--tx)}

.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(16px);z-index:50;
 background:var(--surf3);border:1px solid var(--bd2);border-radius:8px;padding:10px 15px;font-size:12px;
 box-shadow:0 8px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.24s;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast .em{color:var(--human)}

@media (max-width:860px){
 .side{width:230px} #stage{left:230px} .crumb{left:242px} .leg{left:244px}
 .brand{display:none}
}
@media (max-width:640px){
 .side{transform:translateX(-100%)} .side.show{transform:none}
 #stage{left:0} .crumb{left:14px} .leg{left:14px}
 .panel{width:100%;top:auto;bottom:0;height:62%;border-left:0;border-top:1px solid var(--bd);transform:translateY(100%)}
 .panel.open{transform:none}
 body.panel-open .ctl{transform:translateY(-64vh)}
 .srch input{width:120px}
}

/* added: status, sheets, map links */
.sheet{position:fixed;top:52px;left:0;right:0;bottom:0;z-index:38;overflow:auto;background:var(--bg);display:none;padding:28px 16px 60px}
.sheet.on{display:block}
.sheet .in{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.sheet h1{font-family:var(--fd);font-size:26px;margin:0;line-height:1.2}
.sheet h2{font-family:var(--fd);font-size:18px;margin:0 0 10px}
.sheet p{margin:0;color:var(--mu);font-size:14px;line-height:1.6;max-width:72ch}
.sheet .box{background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:18px}
.sheet table{width:100%;border-collapse:collapse;font-size:13px}
.sheet th{font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fa);text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd)}
.sheet td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:top;line-height:1.45}
.sheet tr:last-child td{border-bottom:0}
.sheet .sc{overflow-x:auto}
.pill{display:inline-block;font-family:var(--fm);font-size:9.5px;letter-spacing:.08em;padding:2px 7px;border-radius:5px;border:1px solid;white-space:nowrap}
.pill.new{color:var(--new);border-color:var(--new)} .pill.changed{color:var(--chg);border-color:var(--chg)}
.pill.built{color:var(--agent);border-color:var(--agent)} .pill.tobuild{color:var(--mu);border-color:var(--bd2)} .pill.designed{color:var(--human);border-color:var(--human)} .pill.partly{color:var(--chg);border-color:var(--chg)}
.ladder{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:760px){.ladder{grid-template-columns:minmax(0,1fr)}}
.rung{background:var(--surf2);border:1px solid var(--bd);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.rung .st{font-family:var(--fd);font-weight:600;font-size:14px}
.rung .sure{height:6px;border-radius:3px;background:var(--surf3);overflow:hidden}
.rung .sure i{display:block;height:100%;background:var(--c3)}
.rung .act{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--c3)}
.rung .d{font-size:12.5px;color:var(--mu);line-height:1.45}
.rung .ids{font-family:var(--fm);font-size:10.5px;color:var(--fa)}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px}
.formula .t{background:var(--surf2);border:1px solid var(--bd2);border-radius:9px;padding:10px 12px;text-align:center;line-height:1.35}
.formula .t b{display:block;font-family:var(--fm);font-size:16px;color:var(--tx)}
.formula .t span{font-size:12px;color:var(--mu)}
.formula .op{font-family:var(--fm);font-size:18px;color:var(--fa)}
.formula .t.res{border-color:var(--c3)} .formula .t.res b{color:var(--c3)}
.steps{display:flex;flex-direction:column;gap:8px}
.stp{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surf2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.stp .n{width:26px;height:26px;border-radius:50%;background:var(--surf3);display:grid;place-items:center;font-family:var(--fm);font-size:12px}
.stp .l{font-size:13.5px;line-height:1.4} .stp .l small{display:block;color:var(--fa);font-family:var(--fm);font-size:10.5px;margin-top:2px}
.views{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.views div{background:var(--surf2);border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:13px;line-height:1.4}
.views b{display:block;font-family:var(--fd);margin-bottom:3px}
.views.v3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:700px){.views.v3{grid-template-columns:minmax(0,1fr)}}
.sheet a{color:var(--agent)}
.ccl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.ccl li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:6px;font-size:12px;line-height:1.45}
.ccl b{font-family:var(--fm);font-size:10.5px;color:var(--fa)}
.lkrow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:6px 12px;font-size:12px;color:var(--mu);cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.lkrow:hover,.lkrow.on{background:var(--surf2);color:var(--tx)}
.lkrow .nb{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-family:var(--fm);font-size:10px;color:#0c0f16;font-weight:700}
.oh{padding:12px 14px 4px;font-family:var(--fm);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--fa)}
</style></head><body>

<div class="top">
  <div class="brand">Staffing &amp; Workforce Engines</div>
  <div class="tabs" id="tabs"></div>
  <div class="srch">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"/></svg>
    <input id="q" placeholder="Search nodes…" spellcheck="false"/>
  </div>
  <button class="iconbtn" id="sideBtn" title="Toggle outline">☰</button>
</div>

<aside class="side" id="side">
  <div class="hd" id="outHd">Outline</div>
  <div class="outline" id="outline"></div>
  <div class="ft">
    <b>Keys</b><br/>
    <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>←</kbd> parent · <kbd>→</kbd> child<br/>
    <kbd>F</kbd> fit · <kbd>/</kbd> search · <kbd>Esc</kbd> clear
  </div>
</aside>

<div class="crumb" id="crumb"></div>

<div id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <defs><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#1a2231"/></pattern></defs>
    <g id="vp"><rect x="-9000" y="-9000" width="18000" height="18000" fill="url(#dots)"/>
      <g id="hd"></g><g id="lk"></g><g id="nd"></g></g>
  </svg>
</div>

<div class="leg" id="leg"></div>

<div class="ctl">
  <div class="cluster wide"><button id="expand">Break down all</button><button id="collapse">Roll up all</button></div>
  <div class="cluster"><button id="zo">−</button><div class="z" id="zl">100%</div><button id="zi">+</button><button id="fit" style="font-size:11.5px">Fit</button></div>
</div>

<aside class="panel" id="panel">
  <button class="cl" id="pcl">✕</button>
  <div class="hd2"><span class="kind" id="pk"></span><span class="pid" id="pi"></span><h2 id="pt"></h2></div>
  <div class="bd" id="pb"></div>
</aside>

<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>

<script>
"use strict";
const NS="http://www.w3.org/2000/svg";
const H={agent:{c:"var(--agent)",l:"AI agent",s:"needs judgement"},
 deterministic:{c:"var(--det)",l:"System rule",s:"code, rule, or lookup"},
 human:{c:"var(--human)",l:"Person",s:"a person decides, in the Exception Manager role"},
 engine:{c:"var(--eng)",l:"Calls an engine",s:"asks another engine and waits for its answer"}};

/* ============================ DATA ============================ */
const ENG={

   [
    "CC10",

   ]
  ],
  "cols": [

    "leaves": [

   {

/* ============================ BUILD ============================ */
function buildTree(e){
 byId=new Map();
 const r={id:"L0",label:e.outcome,kind:"outcome",depth:0,collapsed:false,children:[]};
 byId.set("L0",r);
 e.cols.forEach(c=>{
  const n={id:c.id,label:c.label,kind:"composite",cnote:c.note||"",depth:1,collapsed:false,parent:r,children:[],
    from:{ref:"L0",phrase:c.from,words:c.fw||[]}};
  byId.set(c.id,n);
  c.leaves.forEach(l=>{
   const lf={id:l.id,label:l.label,kind:"leaf",handler:l.h,note:l.note||"",st:l.s||"",src:l.src||"",rs:l.r||"",built:l.built||"",ev:l.ev||"",role:l.role||"",reason:l.reason||"",scaffold:l.scaffold||"",calls:l.calls||"",depth:2,parent:n,children:[],
     from:{ref:c.id,phrase:c.label.split(" ").slice(0,4).join(" "),words:[]}};
   byId.set(l.id,lf); n.children.push(lf);});
  r.children.push(n);});
 ROOT=r;
}
const STOP=new Set("the a an is are was of to it and or with for its be that this in on at as by we you your their our not into every each where what against carries which whose than then also both more most less only just still has have one accounts being makes gets".split(" "));
function kw(s){return String(s||"").toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(w=>w&&!STOP.has(w));}
function covFor(w){const n=w.toLowerCase().replace(/[^a-z0-9']/g,"");
 return (ENG[view]?.cov||[]).find(p=>p.w.includes(n));}
function claimed(){const s=new Set();(ENG[view]?.cov||[]).forEach(p=>p.w.forEach(w=>s.add(w)));return s;}

/* ============================ LAYOUT ============================ */
const mc=document.createElement("canvas").getContext("2d");
function wrapT(t,f,m){mc.font=f;const w=String(t).split(" ");let L=[],c="";
 for(const x of w){const s=c?c+" "+x:x;if(mc.measureText(s).width<=m||!c)c=s;else{L.push(c);c=x;}}
 if(c)L.push(c);return L;}
const NW=272,PH=17,PV=13,GX=104,GY=16;
const F1="500 13.5px ui-sans-serif,system-ui,sans-serif", F2="400 11px ui-sans-serif,system-ui,sans-serif";
function measure(n){
 n._l=wrapT(n.label,F1,NW-2*PH);
 let h=PV+18+7+n._l.length*18.5;
 if(n.kind==="leaf"&&n.note){n._n=wrapT(n.note,F2,NW-2*PH-4);h+=5+n._n.length*15;}
 else if(n.kind==="composite"&&n.from?.phrase){n._n=[n.from.phrase];h+=5+15;}
 h+=PV; n._w=NW; n._h=Math.max(h,54);}
const vis=n=>n.collapsed?[]:n.children;
function layout(){let cur=0;
 (function pl(n){measure(n);const kids=vis(n);
  if(!kids.length){n._y=cur+n._h/2;cur+=n._h+GY;}
  else{kids.forEach(pl);n._y=(kids[0]._y+kids[kids.length-1]._y)/2;}
  n._x=n.depth*(NW+GX);})(ROOT);}
function visNodes(){const o=[];(function w(n){o.push(n);vis(n).forEach(w);})(ROOT);return o;}

/* ============================ RENDER ============================ */
const nd=document.getElementById("nd"),lk=document.getElementById("lk"),hdL=document.getElementById("hd");
const svgEl=(t,a)=>{const e=document.createElementNS(NS,t);for(const x in a)e.setAttribute(x,a[x]);return e;};
const COLH=["The outcome","Sub-outcomes","The smallest parts"];
function accent(n){return n.kind==="leaf"?H[n.handler].c:(n.kind==="outcome"?"var(--root)":"var(--comp)");}

function render(anim){
 if(view==="map"){renderMap();return;}
 layout();
 const V=visNodes(), ids=new Set(V.map(n=>n.id));
 lk.textContent="";
 V.forEach(n=>vis(n).forEach(c=>{const x1=n._x+n._w,y1=n._y,x2=c._x,y2=c._y,d=(x2-x1)/2;
  lk.appendChild(svgEl("path",{class:"link",d:`M${x1},${y1} C${x1+d},${y1} ${x2-d},${y2} ${x2},${y2}`,
   stroke:(sel===c||sel===n)?"var(--linkHi)":"var(--link)"}));}));
 hdL.textContent="";
 const minY=Math.min(...V.map(n=>n._y-n._h/2));
 [...new Set(V.map(n=>n.depth))].sort().forEach(d=>{const x=d*(NW+GX);
  const t=svgEl("text",{class:"colh",x:x+2,y:minY-26});t.textContent=(COLH[d]||"").toUpperCase();hdL.appendChild(t);
  hdL.appendChild(svgEl("line",{x1:x,y1:minY-18,x2:x+NW,y2:minY-18,stroke:"var(--bd)","stroke-width":1}));});
 for(const [id,el] of elMap){if(!ids.has(id)){el.remove();elMap.delete(id);}}
 V.forEach(n=>{let g=elMap.get(n.id);
  if(!g){g=svgEl("g",{class:"node-g"});g.dataset.id=n.id;nd.appendChild(g);elMap.set(n.id,g);
   g.addEventListener("click",ev=>{ev.stopPropagation();select(byId.get(g.dataset.id));});
   g.addEventListener("pointerenter",()=>setProv(byId.get(g.dataset.id)));
   g.addEventListener("pointerleave",()=>setProv(sel));}
  g.setAttribute("transform",`translate(${n._x},${n._y-n._h/2})`);
  drawNode(g,n);});

function routeAll(){

 MAP.links.forEach((L,i)=>{const a=L[0],b=L[1],ra=rowOf(a),rb=rowOf(b),ca=colOf(a),cb=colOf(b);let sa,sb,kind;
  if(ra===rb&&Math.abs(ca-cb)===1){sa=ca<cb?"r":"l";sb=ca<cb?"l":"r";kind="side";}
  else if(ra===rb){sa=sb=(ra===0?"t":"b");kind="arc";}
  else if(ra<rb){sa="b";sb="t";kind="vert";} else {sa="t";sb="b";kind="vert";}
  ends[i]={a,b,sa,sb,kind};
  [[a,sa,b],[b,sb,a]].forEach(([k,sd,o])=>{(edges[k+sd]=edges[k+sd]||[]).push({i,k,o,end:k===a?"a":"b"});});});
 const off={};
 Object.values(edges).forEach(list=>{
  const sd=list.length&&ends[list[0].i][list[0].end==="a"?"sa":"sb"];
  list.sort((p,q)=>(colOf(p.o)-colOf(q.o))||(rowOf(p.o)-rowOf(q.o))||(p.i-q.i));
  const n=list.length;
  list.forEach((it,j)=>{const span=(sd==="l"||sd==="r")?LHm-36:CWm-48;const v=n===1?0:(-span/2+span*j/(n-1));
   off[it.i+it.end]=(sd==="l"||sd==="r")?v:CWm/2+v;});});

 GEO=MAP.links.map((L,i)=>{const E=ends[i],A=cardPos(E.a),B=cardPos(E.b);
  const a=port(A,E.sa,off[i+"a"]),b=port(B,E.sb,off[i+"b"]);let c1,c2;
  if(E.kind==="side"){const mx=(a[0]+b[0])/2;c1=[mx,a[1]];c2=[mx,b[1]];}
  else if(E.kind==="arc"){const r=rowOf(E.a),h=(r===0?-1:1)*(55+28*(arcN[r]++%5));const yy=(r===0?Math.min(a[1],b[1]):Math.max(a[1],b[1]))+h;c1=[a[0],yy];c2=[b[0],yy];}

  return {a,b,c1,c2,m:bez(a,c1,c2,b,E.kind==="side"?.5:tt)};});
}

}

/* ---- pan / zoom ---- */
const stage=document.getElementById("stage"),vp=document.getElementById("vp");
function apply(){vp.setAttribute("transform",`translate(${tx},${ty}) scale(${k})`);}
function zlab(){document.getElementById("zl").textContent=Math.round(k*100)+"%";}
function bounds(){
 const bb=vp.getBBox();return {x0:bb.x,y0:bb.y-40,x1:bb.x+bb.width,y1:bb.y+bb.height};}
function fit(an){
 const b=(view==="map")?mapBounds():treeBounds();
 const r=stage.getBoundingClientRect(),pad=54;
 const bw=b.x1-b.x0,bh=b.y1-b.y0;
 k=Math.max(Math.min((r.width-pad*2)/bw,(r.height-pad*2)/bh,1.1),.18);
 tx=pad+(r.width-pad*2-bw*k)/2-b.x0*k; ty=pad+(r.height-pad*2-bh*k)/2-b.y0*k;
 if(an)anim(); else apply();
 zlab();
}
function treeBounds(){const V=visNodes();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 V.forEach(n=>{x0=Math.min(x0,n._x);y0=Math.min(y0,n._y-n._h/2);x1=Math.max(x1,n._x+n._w);y1=Math.max(y1,n._y+n._h/2);});
 return {x0,y0:y0-46,x1,y1};}
function mapBounds(){return {x0:-20,y0:-240,x1:7*CWm+6*GXm+20,y1:3*LHm+2*GYm+200};}
stage.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:1/1.12);},{passive:false});
function zoomAt(cx,cy,f){const nk=Math.min(Math.max(k*f,.18),2.4);
 const r=stage.getBoundingClientRect(),px=cx-r.left,py=cy-r.top;
 tx=px-(px-tx)*(nk/k);ty=py-(py-ty)*(nk/k);k=nk;apply();zlab();}
let dg=false,lx2,ly2,mv;
stage.addEventListener("pointerdown",e=>{if(e.target.closest(".node-g"))return;dg=true;mv=false;lx2=e.clientX;ly2=e.clientY;stage.classList.add("drag");stage.setPointerCapture(e.pointerId);});
stage.addEventListener("pointermove",e=>{if(!dg)return;const dx=e.clientX-lx2,dy=e.clientY-ly2;
 if(Math.abs(dx)+Math.abs(dy)>3)mv=true;tx+=dx;ty+=dy;lx2=e.clientX;ly2=e.clientY;apply();});
stage.addEventListener("pointerup",()=>{dg=false;stage.classList.remove("drag");});
stage.addEventListener("click",e=>{if(!mv&&!e.target.closest(".node-g"))deselect();});
document.getElementById("zi").onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.2);};
document.getElementById("zo").onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.2);};
document.getElementById("fit").onclick=()=>fit(true);
document.getElementById("expand").onclick=()=>{if(view==="map")return;byId.forEach(n=>n.collapsed=false);render(true);buildOutline();setTimeout(()=>fit(true),20);};
document.getElementById("collapse").onclick=()=>{if(view==="map")return;byId.forEach(n=>{if(n.kind==="composite")n.collapsed=true;});render(true);buildOutline();setTimeout(()=>fit(true),20);};
document.getElementById("sideBtn").onclick=()=>{
 const s=document.getElementById("side");
 if(window.innerWidth<=640){s.classList.toggle("show");}
 else{s.classList.toggle("hide");
  stage.classList.toggle("wide");document.getElementById("crumb").classList.toggle("wide");
  document.getElementById("leg").classList.toggle("wide");setTimeout(()=>fit(true),240);}};

/* ---- keyboard ---- */
function flat(){const o=[];(function w(n){o.push(n);vis(n).forEach(w);})(ROOT);return o;}
window.addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT"){return;}
 if(e.key==="/"){e.preventDefault();document.getElementById("q").focus();return;}
 if(e.key==="f"||e.key==="F"||e.key==="0"){fit(true);return;}
 if(e.key==="Escape"){deselect();return;}
 if(view==="map"||view==="changes"||view==="howtol")return;
 const L=flat();
 if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();
  let i=sel?L.indexOf(sel):-1; i=e.key==="ArrowDown"?Math.min(i+1,L.length-1):Math.max(i-1,0);
  focusNode(L[i]);return;}
 if(e.key==="ArrowLeft"){e.preventDefault();if(sel&&sel.parent)focusNode(sel.parent);return;}
 if(e.key==="ArrowRight"){e.preventDefault();
  if(sel&&sel.children.length){sel.collapsed=false;focusNode(sel.children[0]);}return;}
});
window.addEventListener("resize",()=>{if(view!=="changes"&&view!=="howtol")fit(false);});

/* ---- toast ---- */
let tT;function toast(h,ms=3600){const t=document.getElementById("toast");t.innerHTML=h;t.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>t.classList.remove("show"),ms);}

/* ---- coverage toggle via key c ---- */
window.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;
 if(e.key==="c"||e.key==="C"){if(view==="map"||view==="changes"||view==="howtol")return;cov=!cov;claims.clear();
  const g=elMap.get("L0"),n=byId.get("L0");if(g&&n)drawNode(g,n);render(false);
  toast(cov?"Coverage on. <span class='em'>Amber</span> words in the outcome have nothing under them. Click a word.":"Coverage off.");}});

/* ---- sheets: what changed, and how rotation computes ---- */
function srcName(s){const N={research:"the research review",rotation:"the rotation design",client:"client input, 1 October",insights:"the Skill Rotation insights deck",ruling:"the four-engine ruling of 24 September",methodology:"the methodology check of 1 October"};
 const parts=String(s||"").split(" + ").map(x=>N[x.trim()]||x);const txt=parts.length>1?parts.slice(0,-1).join(", ")+" and "+parts[parts.length-1]:parts[0];return txt.charAt(0).toUpperCase()+txt.slice(1);}
function changesHTML(){
 let nNew=0,nChg=0,rows="";
 Object.keys(ENG).forEach(k=>{const E0=ENG[k];E0.cols.forEach(c=>c.leaves.forEach(l=>{if(!l.s)return;if(l.s==="new")nNew++;else nChg++;
  rows+=`<tr><td>${E0.name}</td><td><b style="font-family:var(--fm)">${l.id}</b></td><td>${l.label}</td><td style="color:${H[l.h].c}">${H[l.h].l}</td><td><span class="pill ${l.s}">${l.s.toUpperCase()}</span></td><td>${srcName(l.src)}</td><td style="font-family:var(--fm);font-size:11.5px;color:var(--mu)">${l.r||""}</td></tr>`;}));});
 const lkN=MAP.links.filter(L=>L[3]==="new").length,lkC=MAP.links.filter(L=>L[3]==="changed").length;
 return `<div><h1>What changed in the engine map</h1><p style="margin-top:8px">Six sources changed this map. The sponsor's ruling of 24 September split Contract-to-Capacity into four engines. The research review applied the HR research findings to every engine they touch. The rotation design added the two rotation engines, which answer the client's skill-rotation concern. The client's input of 1 October and the Skill Rotation insights deck refined them. The methodology check of 1 October fixed every engine to the Template Kit's completion checklist. Every new or changed part is listed with the finding or reason behind it.</p></div>
 <div class="views"><div><b>4 ruled engines</b>Contract-to-Capacity as Scope-to-Plan, Capacity-and-Holds, Gap-Ownership and Commitment-Control</div><div><b>2 new engines</b>Top-of-License Planning (${ENG.tlp.cols.reduce((a,c)=>a+c.leaves.length,0)} parts) and Rotation Moves (${ENG.tlm.cols.reduce((a,c)=>a+c.leaves.length,0)} parts)</div><div><b>${lkN} new links, ${lkC} changed</b>See the numbered links on the map</div><div><b>${nNew} new parts, ${nChg} changed</b>Across all nine engines</div><div><b>Methodology check: 0 failures</b>Run on 1 October. Two flags for a person: Scope-to-Plan has six judgment parts and Hire-or-Grow five, where the method says roughly four or fewer</div></div>
 <div class="box"><h2>Summary of changes</h2><div class="sc"><table><tr><th>Where</th><th>Item</th><th>Change</th><th>Source</th><th>Why</th><th>Findings</th></tr>${CHANGES.map(c=>`<tr><td>${c[0]}</td><td><b>${c[1]}</b></td><td>${c[2]}</td><td>${srcName(c[3])}</td><td style="color:var(--mu)">${c[4]}</td><td style="font-family:var(--fm);font-size:11.5px;color:var(--mu)">${c[5]}</td></tr>`).join("")}</table></div></div>
 <div class="box"><h2>Every new or changed part</h2><div class="sc"><table><tr><th>Engine</th><th>Part</th><th>What it does</th><th>Handled by</th><th>Status</th><th>Source</th><th>Findings</th></tr>${rows}</table></div></div>
 <p>Sources: the research review, the rotation design, client input received on 1 October, and the Skill Rotation insights deck. Research numbering follows the HR Research Synthesis and the final research review: P problem and scope, S stages, SYS systems, EV evidence, REC records, R rules, RR records against reality, B bottlenecks, D decisions, W workshop questions. Issues 1 to 13 are the research review's issues.</p>`;
}
function howHTML(){
 const P0=ENG.tlp, M0=ENG.tlm;
 const rung=(st,sure,act,d,ids)=>`<div class="rung"><span class="st">${st}</span><span class="sure" title="How sure the firm is that the work will happen"><i style="width:${sure}%"></i></span><span class="act">${act}</span><span class="d">${d}</span><span class="ids">${ids}</span></div>`;
 const LBL={built:"BUILT · NOT YET VERIFIED",partly:"PARTLY BUILT",tobuild:"NOT BUILT"};
 const step=(n,l,ids,st,note)=>`<div class="stp"><span class="n">${n}</span><span class="l">${l}<small>${ids}${note?" · "+note:""}</small></span><span class="pill ${st}">${LBL[st]}</span></div>`;
 return `<div><h1>How rotation computes</h1><p style="margin-top:8px">Two engines share the work. Top-of-License Planning plans moves across time; Rotation Moves turns a job nobody free can fill into an agreed chain. It reads signed work and the pipeline, weighs each deal by how likely it is, works out the chains of moves that free the right people in time, and measures the expected value of work at risk under each plan, with the bad case beside it. Each step rests on a published method; the <a href="03-Rotation-Planning-Method.html" target="_blank" rel="noopener">method page</a> gives the sources. People decide every move. No AI model makes a decision; the plan comes from ordinary code that gives the same answer for the same inputs.</p></div>
 <div class="box"><h2>The outcomes</h2><p style="color:var(--tx);font-size:15px"><b>Top-of-License Planning.</b> ${P0.outcome}</p><p style="color:var(--tx);font-size:15px;margin-top:10px"><b>Rotation Moves.</b> ${M0.outcome}</p></div>
 <div class="box"><h2>The deal stage sets how firm the action is</h2><p style="margin-bottom:14px">Stage names and probabilities are placeholders. The real ones come from the firm's pipeline and its win history (A4).</p>
 <div class="ladder">
  ${rung("Signal",8,"Watch","Counted in the forecast at its probability. No names are used.","A2, A4")}
  ${rung("Interest",20,"Watch and grow","Shortfalls by skill and level show weeks ahead. Growth starts for people who need time to reach the next level.","C5, B5")}
  ${rung("Qualified",40,"Prepare","Chains are found and timed. Releases with long lead times are asked early.","C3, C4, E1")}
  ${rung("Competing",60,"Hold","Holds and early moves need the work-at-risk approver.","E5, T7")}
  ${rung("Signed",100,"Move","Moves happen once the release, the person and the receiving lead say yes.","E1–E4, T6")}
  ${rung("Deployed",100,"Learn","Roll-offs feed the next plan. Forecast accuracy is measured by stage.","A5, G3")}
 </div></div>
 <div class="box"><h2>Value of work at risk, measured two ways</h2><p style="margin-bottom:14px">"Value at risk" has a precise finance meaning, so the engine reports two named measures (D1), using the planning policy draft's term. Sources and a live scenario test are on the <a href="03-Rotation-Planning-Method.html" target="_blank" rel="noopener">method page</a>.</p>
 <div class="formula"><div class="t"><b>Expected value of work at risk</b><span>the average over all scenarios: chance won × value lost if late, plus chance lost × cost wasted by preparing</span></div><div class="t res"><b>Bad case, 90%</b><span>the average of the worst 10% of scenarios</span></div></div>
 <p style="margin-top:14px">Prepare a role now when <b style="color:var(--tx)">chance won × value saved by preparing</b> is greater than <b style="color:var(--tx)">chance lost × cost wasted by preparing</b>. On invented data this rule gives the lowest average loss of all 256 possible plans; cutting the bad case further costs average loss, which is the client's risk appetite.</p></div>
 <div class="box"><h2>Step by step</h2><p style="margin-bottom:12px">What the engine does on every run, the parts of the tree that do it, and how far the PoC build has got. Checked on 1 October against branch rotation-poc of the PoC: its 55 rotation tests pass when re-run on a copy. Only the compile of the moves engine is independently verified so far; a planning engine is being compiled.</p><div class="steps">
  ${step(1,"Read demand month by month: signed roles, forecast roles with stage and odds, roll-offs, and the value of each role","Planning A1–A7","partly","stale odds are not flagged yet")}
  ${step(2,"Confirm each person's license and the level of work they actually do","Planning B1–B4","partly","license age is checked; the named confirmation is not wired")}
  ${step(3,"Keep only roles that no free person can fill at standard","Moves C1","built","")}
  ${step(4,"Check every person against each role on the move rules, including eligibility time by band","Moves C2","partly","rules built; eligibility by band is in the sketch, not yet in the PoC build")}
  ${step(5,"Search chains, one level down each time, to a free person or a junior hire","Moves C3","built","")}
  ${step(6,"Time each move against release and time in role, and add growth moves for people ready in time","Planning C4, C5, B5","built","")}
  ${step(7,"Work out the expected value of work at risk, and the bad case over many outcomes of which deals win","Planning D1, D3","partly","expected value built; scenarios, bad case and key-person risk not")}
  ${step(8,"Choose one plan across all roles, month by month, with nobody moved twice and every client job covered","Planning D2","built","constraint solver, nine months")}
  ${step(9,"Prove the plan safe before anyone sees it","Planning D4","built","independent recount and limits check")}
  ${step(10,"Rank recommendations by the value of work at risk each removes, and explain each in plain words","Planning D5–D7","partly","ranking built; plain-word explanation not")}
  ${step(11,"Ask for every yes: release, the person, the receiving lead, finance or mobility, work-at-risk","Moves E1–E4; Planning E5","partly","decisions compiled in the verified moves engine; wiring in progress")}
 </div></div>
 <div class="box"><h2>What decision makers see</h2><div class="views v3">
  <div><b>Signed or forecast</b>Switch between signed work only and the probability-weighted pipeline</div>
  <div><b>Supply against demand</b>By skill, level and week, with the shortfalls marked</div>
  <div><b>License against work</b>Who works below their license, by how much, and for how long</div>
  <div><b>Value of work at risk</b>Expected and bad case, by deal, by stage and in total, for each plan</div>
  <div><b>Moves on a timeline</b>Every move in every chain, with its approvals and dates</div>
  <div><b>Recommendations</b>Ranked by the value of work at risk each one removes</div></div></div>
 <p>See the rules, chains and safety checks working on invented data in the <a href="02-Top-of-License-Rotation-Sketch.html" target="_blank" rel="noopener">rotation sketch</a>.</p>`;
}

buildTabs();go("map");
setTimeout(()=>toast("Click an engine to open it, or a numbered link to see what passes. <span class='em'>NEW</span> and <span class='em'>CHANGED</span> mark what the research and the rotation design added.",6000),700);
