<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contract-to-Capacity Facilitator Guide</title>
<style>
:root{
  --ink:#1F2A33; --ink2:#46535E; --mute:#68747F; --line:#DCE1E5; --surf:#F3F5F6; --paper:#FFFFFF; --ground:#F7F8F9;
  --teal:#287079; --teal-s:#E2EFF0; --red:#E8412A; --red-s:#FDE9E5; --slate:#36454F; --slate-s:#E6EAED;
  --amber:#A86A12; --amber-s:#FBF0DD; --green:#2B7A50; --green-s:#E2F1E8;
  --tA:var(--teal); --tB:var(--red); --tC:var(--slate); --tA-s:var(--teal-s); --tB-s:var(--red-s); --tC-s:var(--slate-s);
  --shadow:0 1px 2px rgba(31,42,51,.06),0 6px 18px rgba(31,42,51,.05);
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E8ECEF; --ink2:#C3CBD1; --mute:#9AA6B0; --line:#2F3A42; --surf:#1D252B; --paper:#161D22; --ground:#11171B;
  --teal:#5FB3BC; --teal-s:#173236; --red:#FF7A63; --red-s:#3A1F1A; --slate:#A9B8C3; --slate-s:#232D34;
  --amber:#E2A84B; --amber-s:#33281A; --green:#6CC496; --green-s:#173025; --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#E8ECEF; --ink2:#C3CBD1; --mute:#9AA6B0; --line:#2F3A42; --surf:#1D252B; --paper:#161D22; --ground:#11171B;
  --teal:#5FB3BC; --teal-s:#173236; --red:#FF7A63; --red-s:#3A1F1A; --slate:#A9B8C3; --slate-s:#232D34;
  --amber:#E2A84B; --amber-s:#33281A; --green:#6CC496; --green-s:#173025; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
a{color:var(--teal)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:22px}
h3{font-size:17px}
p{margin:0}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px}
.top{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding-block:12px}
.brandline{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.brandline h1{font-size:19px}
.brandline .sub{font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tabs a{text-decoration:none;color:var(--ink2);font-weight:700;font-size:14px;padding:8px 12px;border-radius:8px}
.tabs a[aria-current="page"]{background:var(--teal-s);color:var(--teal)}
.tabs a:hover{background:var(--surf)}
main{padding-block:24px 60px}
.lead{color:var(--ink2);max-width:72ch;margin-top:6px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .btn.primary,.dark-primary{color:#0b1013}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surf);color:var(--ink2);white-space:nowrap}
.chip.A{background:var(--tA-s);color:var(--tA)} .chip.B{background:var(--tB-s);color:var(--tB)} .chip.C{background:var(--tC-s);color:var(--tC)}
.muted{color:var(--mute)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;left:-9999px}

/* plan */
.plan-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start;margin-top:18px}
.dayhead{display:flex;align-items:baseline;gap:12px;margin:22px 0 10px}
.dayhead:first-child{margin-top:0}
.dayhead h3{font-size:16px}
.srow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.srow .when b{display:block;font-size:17px}
.srow .when span{font-size:12.5px;color:var(--mute)}
.srow .stitle{font-weight:800;margin-bottom:8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.opts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{position:relative;display:flex;flex-direction:column;gap:4px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px 10px 14px;background:var(--paper);cursor:pointer;min-height:100%}
.opt:hover{border-color:var(--mute)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .tk{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding-right:18px}
.opt.A .tk{color:var(--tA)} .opt.B .tk{color:var(--tB)} .opt.C .tk{color:var(--tC)}
.opt b{font-size:14.5px;line-height:1.25}
.opt .one{font-size:13px;color:var(--ink2);line-height:1.35}
.opt .meta{font-size:12px;color:var(--mute);margin-top:auto;padding-top:4px}
.opt.on.A{border-color:var(--tA);background:var(--tA-s)} .opt.on.B{border-color:var(--tB);background:var(--tB-s)} .opt.on.C{border-color:var(--tC);background:var(--tC-s)}
.opt.on::after{content:"✓";position:absolute;top:8px;right:10px;font-weight:900;font-size:14px}
.opt:focus-within{outline:3px solid var(--teal-s);outline-offset:1px}
.brk{display:grid;grid-template-columns:92px 1fr;gap:14px;padding:8px 0;border-top:1px solid var(--line);color:var(--mute);font-size:13.5px}
.summary{position:sticky;top:86px;display:flex;flex-direction:column;gap:14px}
.summary h3{font-size:15px}
.mix{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surf)}
.mix div{height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.warn{background:var(--amber-s);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px}
.ok{background:var(--green-s);border-radius:8px;padding:8px 10px;font-size:13px}
.energy svg{width:100%;height:auto;display:block}
.outputs{margin-top:28px;display:grid;gap:18px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:8px 10px;border-bottom:1.5px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.brkrow td{color:var(--mute);background:var(--surf)}
.tblwrap{overflow-x:auto}
.steps-inline{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.steps-inline span b{font-variant-numeric:tabular-nums;color:var(--teal);margin-right:6px}
.mat{columns:2 300px;column-gap:28px}
.mat label{display:flex;gap:8px;align-items:flex-start;break-inside:avoid;padding:4px 0;font-size:14px}
.mat .ses{font-size:12px;color:var(--mute)}
.slidelist{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background:var(--surf);border-radius:8px;padding:12px;word-break:break-word}

/* run */
.runbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.runbar select{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);max-width:100%}
.clock{margin-left:auto;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.run-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;margin-top:16px;align-items:start}
.optswitch{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.optswitch button{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 12px;font-weight:700;font-size:13px}
.optswitch button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.drift{display:inline-block;font-weight:800;border-radius:8px;padding:6px 10px;font-size:14px}
.drift.ok{background:var(--green-s);color:var(--green)} .drift.late{background:var(--red-s);color:var(--red)} .drift.early{background:var(--teal-s);color:var(--teal)}
.steplist{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.steplist li{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.steplist li.now{border-color:var(--red);box-shadow:0 0 0 3px var(--red-s)}
.steplist li.done{opacity:.6}
.steplist .t{font-weight:800;font-variant-numeric:tabular-nums}
.steplist .t small{display:block;font-weight:600;color:var(--mute)}
.steplist .lab{font-weight:800}
.steplist button{border:1.5px solid var(--teal);background:var(--paper);color:var(--teal);border-radius:8px;padding:6px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.steplist li.done button{border-color:var(--line);color:var(--mute)}
.say{border-radius:10px;background:var(--teal-s);padding:12px 14px;font-size:15px}
.say p+p{margin-top:6px}
.flexbox{display:flex;flex-direction:column;gap:10px}
.flexitem{border-radius:10px;padding:10px 12px;background:var(--surf)}
.flexitem b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-bottom:2px}
.flexitem.hot{background:var(--red-s)}
.flexitem.hot b{color:var(--red)}
.check{border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px}
.check ol{margin:6px 0 0;padding-left:20px}
.check .ans{color:var(--green);font-weight:800}

/* sessions */
.sesscard{margin-top:14px}
.sesscard summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px}
.sesscard summary::-webkit-details-marker{display:none}
.sesscard summary .when b{display:block;font-size:17px}
.sesscard summary .when span{font-size:12.5px;color:var(--mute)}
.sesscard summary h3{font-size:18px}
.sesscard summary .key{font-size:13.5px;color:var(--ink2);margin-top:3px}
.sesscard[open] summary{border-bottom:1px solid var(--line)}
.sessbody{padding:18px;display:grid;gap:18px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.list{margin:6px 0 0;padding-left:20px}
.list li{margin:3px 0}
.optfull{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;background:var(--paper)}
.optfull.chosen.A{border-color:var(--tA)} .optfull.chosen.B{border-color:var(--tB)} .optfull.chosen.C{border-color:var(--tC)}
.optfull h4{font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl{display:flex;height:30px;border-radius:7px;overflow:hidden;gap:2px}
.tl div{display:flex;align-items:center;padding:0 7px;font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin-bottom:3px}
.stepsfull{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.stepsfull li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;font-size:14px}
.stepsfull li b{color:var(--teal);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* audience */
.ladder{display:flex;flex-direction:column-reverse;gap:6px;margin-top:12px}
.rung{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.rung .n{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:900}
.rung .who{font-size:13px;color:var(--mute)}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:12px}
.gloss div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
.gloss b{display:block}
.gloss .when{font-size:12px;color:var(--teal);font-weight:700;margin-top:4px}
.banned{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.banned span{font-size:13px;padding:3px 9px;border-radius:99px;background:var(--red-s);color:var(--red);text-decoration:line-through}
.stagegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.stagegrid div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px}
.stagegrid b{display:block;font-size:14.5px;margin-bottom:4px}
.stagegrid .r{color:var(--red);font-weight:700}
.handoff{display:flex;flex-direction:column;gap:0;margin-top:12px}
.handoff .h{display:grid;grid-template-columns:92px minmax(0,1fr) minmax(0,1fr);gap:14px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
pre.code{background:var(--surf);border-radius:8px;padding:12px;overflow-x:auto;font-size:13.5px;margin:6px 0}
.steps-num{counter-reset:s;list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:10px}
.steps-num li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.steps-num li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-weight:700;z-index:50}
@media (max-width:1000px){.plan-grid,.run-grid{grid-template-columns:1fr}.summary{position:static}.opts3{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media (max-width:640px){.srow,.brk{grid-template-columns:1fr}.sesscard summary{grid-template-columns:1fr}.rung{grid-template-columns:44px 1fr}.rung .who{grid-column:2}.handoff .h{grid-template-columns:1fr}.steplist li{grid-template-columns:1fr}.tabs{margin-left:0}}
@media print{
  .top,.summary,.quick,.noprint,.filters,.runbar button{display:none!important}
  body{background:#fff;color:#000;font-size:11pt}
  .card{box-shadow:none}
  .plan-grid{display:block}
  details.sesscard{break-inside:avoid-page}
  details.sesscard:not([open]) .sessbody{display:grid!important}
  a{color:#000}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brandline"><span class="eyebrow">Facilitator guide</span><h1 id="gTitle">Contract-to-Capacity Workshop</h1><span class="sub" id="gSub"></span></div>
  <nav class="tabs" aria-label="Guide sections">
    <a href="#plan">Plan</a><a href="#run">Run</a><a href="#sessions">Sessions</a><a href="#audience">Audience and thread</a><a href="#room">Room tool</a><a href="#kit">Print kit</a>
  </nav>
</div></header>
<main class="wrap" id="view" tabindex="-1"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const D = {"meta": {"title": "Contract-to-Capacity Workshop", "subtitle": "HR Global Staffing · Liverpool AI Innovation Lab", "dates": "6–7 October 2026", "day1": "Tuesday 6 October", "day2": "Wednesday 7 October", "promise": "Before a deal is signed, we know whether we can staff it. If we cannot, a named person owns the gap.", "overall": "An agreed way of turning a deal into staffed work, tested on real cases, with clear jobs for people and for the system, and a decision on what to take forward.", "invented": "The Northgate deal and every person in it are invented for this workshop."}, "tracks": {"A": {"name": "Hands-on", "line": "Paper, walls and moving around the room", "color": "287079", "icon": "TbHandClick"}, "B": {"name": "Live voting", "line": "Phones and the room screen", "color": "FF462D", "icon": "TbDeviceMobile"}, "C": {"name": "Cases and conversation", "line": "Your own cases, role-play, debate, or talking it through", "color": "36454F", "icon": "TbMasksTheater"}}, "ladder": [{"rung": 0, "short": "Why we are here", "can": "I know why we are here and what we decide at the end."}, {"rung": 1, "short": "The real problem", "can": "I see where records and reality part, at each stage of a deal."}, {"rung": 2, "short": "The result we want", "can": "I can say the result we want, and how a record would prove it."}, {"rung": 3, "short": "Who decides", "can": "I know which decisions need a person, who, and what they need to see."}, {"rung": 4, "short": "When things go wrong", "can": "I can write the rule for an exception: what happens, who decides, by when."}, {"rung": 5, "short": "Judge a working version", "can": "I can test a working version and say what it got wrong."}, {"rung": 6, "short": "Rules for moves", "can": "I can set the rules for moving people up to the work they are qualified for."}, {"rung": 7, "short": "Decide what next", "can": "I can weigh the evidence and decide what to take forward."}], "glossary": [{"term": "Contract-to-Capacity", "plain": "Turning a deal we are likely to win into a staffing plan, checking who is really free, and giving every unfilled role an owner.", "first": "d1-welcome"}, {"term": "Engine", "plain": "A system that runs one kind of work from start to a checked finish. It drafts, follows agreed rules, and sends the hard calls to named people.", "first": "d1-welcome"}, {"term": "Proof of Concept", "plain": "A first working version, built during these two days, to test the idea on real cases.", "first": "d1-welcome"}, {"term": "Proceed, Narrow or Stop", "plain": "The three possible decisions at the end of Day 2. Proceed: go ahead as planned. Narrow: go ahead with a smaller scope. Stop: not now, and we say why.", "first": "d1-welcome"}, {"term": "Record", "plain": "What a system says, such as Workday or Atlas.", "first": "d1-reality"}, {"term": "Shortfall", "plain": "Nobody found yet. Not a gap until someone has checked.", "first": "d1-reality"}, {"term": "Gap", "plain": "A confirmed shortage, with its evidence, declared by a named person, and owned.", "first": "d1-reality"}, {"term": "Outcome", "plain": "The result we promise for every deal. True or false for one deal, and provable from a record.", "first": "d1-outcome"}, {"term": "Done checks", "plain": "The checks that prove a deal's case is finished, read from a record we trust.", "first": "d1-outcome"}, {"term": "Hold", "plain": "Held: a person is reserved for this deal, for a limited time. The hold ends on its own unless someone renews it.", "first": "d1-outcome"}, {"term": "Decision owner", "plain": "The role that makes a decision, with a backup and a response time. A role, not a team.", "first": "d1-decisions"}, {"term": "Evidence", "plain": "The facts a decision owner needs, and the system or person each one comes from.", "first": "d1-decisions"}, {"term": "Rule", "plain": "When this happens, then this, decided by this role, by this time. If nobody answers, it goes to this role.", "first": "d1-rules"}, {"term": "Top of license", "plain": "Working at the highest level you are qualified for.", "first": "d2-rotation"}, {"term": "Chain of moves", "plain": "A new job is filled by someone stepping up, others step up behind them, and a junior hire or a free person fills the last job.", "first": "d2-rotation"}, {"term": "Pilot", "plain": "The first real use of the new way of working, on a small part of the business, to learn safely before going wider.", "first": "d2-rotation"}, {"term": "First slice", "plain": "The part of the business the pilot starts with: which practice, country, deals and decisions.", "first": "d2-next"}, {"term": "Baseline", "plain": "How the work performs today, measured, so we can show any improvement.", "first": "d2-next"}], "case": {"id": "ENG-0412", "name": "The Northgate deal", "client": "Northgate", "work": "Network and cloud migration", "value": "£2.4m", "start": "2 November", "where": "Liverpool", "label": "Invented for this workshop", "when": "A deal from last year, replayed", "frame": "We replay what happened to Northgate last year, stage by stage. On Day 2 we run the same deal again through the working version, as if it were new.", "roles": [{"id": "R1", "title": "Cloud network engineer", "level": "Band 7", "icon": "TbCloudNetwork", "story": "Workday says P-20931 is free from 1 November. Only their manager knows the current project runs to late November."}, {"id": "R2", "title": "Firewall specialist", "level": "Band 6", "icon": "TbShieldLock", "story": "The search finds nobody, so a hire is requested. One person with the skill exists, on another account, and nobody asked."}, {"id": "R3", "title": "Project manager", "level": "Band 7", "icon": "TbClipboardList", "story": "Another deal wants the same project manager in December."}, {"id": "R4", "title": "Knowledge-transfer lead", "level": "To be sized", "icon": "TbSchool", "story": "The contract says \"knowledge transfer as agreed\". Nobody knows how much."}], "stages": [{"n": 1, "name": "Demand emerges", "icon": "TbBuildingSkyscraper", "record": "Atlas shows the deal entering contract drafting on 8 September.", "reality": "The client first raised it in April. Nobody decided whether it was real enough to prepare for.", "lesson": "Nobody decides when demand is real enough to start.", "ref": "S1"}, {"n": 2, "name": "Work becomes a staffing need", "icon": "TbFileText", "record": "The cost case prices six people across four roles, at Bands 6 and 7, by service.", "reality": "Nobody turned that into skills. One line says \"knowledge transfer as agreed\".", "lesson": "Sales and staffing describe the same work differently.", "ref": "S2"}, {"n": 3, "name": "Staffing sees the request", "icon": "TbInbox", "record": "The staffing request was raised three weeks before the start date.", "reality": "Staffing heard about it in a corridor a month earlier, and some work had started outside the tools.", "lesson": "The request arrives late, and some staffing happens outside the tools.", "ref": "S3"}, {"n": 4, "name": "Who could do it, and who is free", "icon": "TbUserSearch", "record": "Workday shows the cloud network engineer free from 1 November.", "reality": "Their current project runs to late November. Only their manager knew.", "lesson": "Free in the system is not free in reality.", "ref": "S4"}, {"n": 5, "name": "Can they actually start", "icon": "TbDoorExit", "record": "Nothing. Nobody asked.", "reality": "Their manager would have released them two weeks early, if asked.", "lesson": "Free, releasable and ready to start are three different things.", "ref": "S5"}, {"n": 6, "name": "Is there a real gap", "icon": "TbUserQuestion", "record": "The search for a firewall specialist found no match. A gap was recorded and a hire requested.", "reality": "Someone with the skill worked on another account. Nobody asked whether they could move, or whether moves could free someone.", "lesson": "No match is not a confirmed gap.", "ref": "S6"}, {"n": 7, "name": "The gap goes to action", "icon": "TbRocket", "record": "A hiring request and a subcontractor quote at a higher cost. The deal was signed on 29 September.", "reality": "The plan was never approved and the gap had no owner. The deal was signed without knowing it could be staffed.", "lesson": "A gap needs an owner, and a signature needs an approved plan.", "ref": "S7"}], "real_example": "In a real case from HR's research, roles that seemed to need external hires were filled internally once someone checked who was really busy and who could be released.", "exceptions": [{"id": "X1", "name": "Scope too vague to staff", "icon": "TbFileUnknown", "northgate": "The contract says \"knowledge transfer as agreed\". How many people, for how long?", "draft_rule": "It becomes a question to the solution lead, with a deadline. The plan waits. No answer by the deadline: it goes to the engagement lead.", "options": ["Plan a standard size; correct it later", "Ask the solution lead; the plan waits", "Leave it out of the plan"], "draft_option": 1, "alt_rule": "Plan knowledge transfer at a standard size, such as one person for four weeks. Correct it when the scope is clear."}, {"id": "X2", "name": "Two deals want the same person", "icon": "TbArrowsCross", "northgate": "Northgate and another deal both want the same project manager in December.", "draft_rule": "The clash is spotted when the second hold is placed. The resourcing lead decides which hold stays, with a reason. The other deal records a shortfall.", "options": ["The resourcing lead decides, with a reason", "The first hold wins", "The likelier deal wins, by a fixed rule"], "draft_option": 0, "alt_rule": "The deal more likely to be signed keeps the person, by a fixed rule on win chance. Nobody needs to decide."}, {"id": "X3", "name": "A skill missing from the approved list", "icon": "TbListSearch", "northgate": "Northgate needs \"Azure Virtual WAN\". It is not on the approved skills list.", "draft_rule": "It becomes a question to the owner of the skills list, with a deadline. Nobody slips in a near match without saying so.", "options": ["Add it to the list yourself", "Use the nearest skill, marked as near", "Ask the list owner, with a deadline"], "draft_option": 2, "alt_rule": "Use the nearest skill on the list and mark it as a near match. The list owner reviews near matches every month."}, {"id": "X4", "name": "A release is refused", "icon": "TbHandStop", "northgate": "The only other person with the firewall skill is the sole expert on their own account. Their manager says no.", "draft_rule": "The refusal and its reason are recorded as evidence. The search goes on, and the role stays a shortfall until a named person declares a gap.", "options": ["A practice lead can overrule within two days", "Declare a gap straight away", "Record the refusal; keep searching"], "draft_option": 2, "alt_rule": "A refusal goes to the practice lead, who can overrule the manager within two days when the deal is worth more."}, {"id": "X5", "name": "Blocked by cost, not by people", "icon": "TbCurrencyPound", "northgate": "A qualified person is free in another country, but their cost base makes the role unaffordable.", "draft_rule": "It is recorded as a cost block, never as a missing skill. A named person decides whether to pay the difference.", "options": ["Record a cost block; a named person decides", "Above a set difference, treat it as a gap", "Use them and fix the cost later"], "draft_option": 0, "alt_rule": "Above a set cost difference, treat it as a gap and send it to hiring. Below it, use the person."}]}, "decisions": [{"id": "D1", "q": "Is the demand real enough to start?", "icon": "TbFlag", "owner": "Engagement lead", "confirm": true, "why": "Trust not yet earned", "evidence": "Deal stage and win chance, value, expected start", "source": "Atlas", "northgate": "First raised in April, in contract drafting by September, £2.4m, start 2 November."}, {"id": "D2", "q": "Is the requirement complete enough for staffing?", "icon": "TbClipboardCheck", "owner": "Planner", "confirm": false, "why": "Trust not yet earned", "evidence": "Every role traced to the contract, with grade, skills, effort and dates; open questions closed", "source": "The plan, the staffing request, the SDM cost case", "northgate": "Four roles; one question open on knowledge transfer."}, {"id": "D3", "q": "Is the person really free?", "icon": "TbUserCheck", "owner": "Current manager", "confirm": false, "why": "Trust not yet earned", "evidence": "Real workload, the date they are free, the skills that matter", "source": "Workday, then the current manager", "northgate": "Workday says 1 November. The manager says late November."}, {"id": "D4", "q": "Can they be released?", "icon": "TbDoorExit", "owner": "Releasing manager", "confirm": true, "why": "Reasonable people disagree", "evidence": "Current client commitments, key-person flag, release date", "source": "Workday, the current account, the manager", "northgate": "Could release two weeks early, if asked."}, {"id": "D5", "q": "Is the shortfall a real gap?", "icon": "TbUserQuestion", "owner": "Resourcing lead", "confirm": true, "why": "Reasonable people disagree", "evidence": "Who was searched and why not, release answers, rotation answer, cause: people or cost", "source": "The search record, Kortex, the release answers", "northgate": "Firewall specialist: one person with the skill works elsewhere. Nobody asked whether they could be released, or whether moves could free someone."}, {"id": "D6", "q": "What is the response to the gap?", "icon": "TbRoute", "owner": "Practice lead", "confirm": false, "why": "Reasonable people disagree", "evidence": "The gap and its cause, cost, how long a hire takes, whether the skill can be grown", "source": "The gap record, hiring and training costs", "northgate": "Grow, hire, subcontract or move the start date?"}], "room_rules": [["Correct the draft", "Everything starts from a draft. Fix it, don't start over.", "TbPencil"], ["Decide, don't wait for everyone", "Every session en ", "What would change", "How we work"]}], "check": {"q": "What will the sponsor decide at the end of tomorrow?", "options": ["Proceed, Narrow or Stop", "Which software to buy", "Who joins the project team"], "answer": 0, "if_wrong": "Go back to the three-doors slide. Repeat that a clear Narrow or Stop is also a success."}, "flex": {"cut": "Drop the activity to 5 minutes: three voices only.", "stretch": "Let two more people speak in the activity.", "lost": "If people look unsure about what the workshop is for, read the promise again and point to tomorrow's three doors.", "skip": "Cannot be skipped: the decision criteria start here.", "revisit": "The decision criteria come back at 16:15 tomorrow."}, "risks": [["The sponsor is delayed.", "The facilitator reads the promise and the sponsor speaks at 10:45."]], "introduces": true}, {"id": "d1-reality", "day": 1, "start": "09:30", "end": "10:45", "minutes": 75, "kind": "content", "title": "Ground in reality", "agenda": "Replay one representative staffing case end to end across the seven stages. At each stage, compare what the records said with what was actually true.", "objectives": ["Follow one deal through the seven stages.", "Spot where the record and reality parted, at each stage.", "Tell a shortfall from a gap.", "Agree the room's top three pain points."], "rung_in": 0, "rung_out": 1, "key": "What the records say is not always true. The new way of working has to check.", "words": ["Record", "Shortfall", "Gap"], "outputs": ["Shared view of current reality, gaps and pain points"], "slides": ["divider", "caseCard", "sevenStages", "stage1", "stage2", "stage3", "stage4", "stage5", "stage6", "stage7", "fourChain", "researchBars", "realExample", "shortfallGap"], "options": [{"key": "A", "name": "Walk the wall", "one": "Walk the Northgate deal along seven posters; add your own cases; vote the biggest pains.", "group": "Whole room, standing", "energy": "High", "best": "The room has energy and space to move.", "materials": ["Se     withOpts.forEach(s => { const o = chosen(s); (o.materials || []).forEach(mt => { const k = mt.trim(); if (!map.has(k)) map.set(k, []); map.get(k).push(s); }); });
    return [...map.entries()];
  }
  function roomActs() {
    const out = [];
    withOpts.forEach(s => (chosen(s).room || []).forEach(a => { if (!out.find(x => x.id === a)) out.push({ id: a, s, title: (D.activities[a] || {}).title || a }); }));
    return out;
  }
  function runSheetText() {
    const lines = [D.meta.title + ' · run sheet', D.meta.dates, ''];
    let day = 0;
    S.forEach(s => {
      if (s.day !== day) { day = s.day; lines.push('', dayName(day).toUpperCase()); }
      if (!s.options || !s.options.length) { if (s.minutes) lines.push(`${s.start}–${s.end}  ${s.title}`); return; }
      const o = chosen(s); let t = toMin(s.start);
      lines.push(`${s.start}–${s.end}  ${s.title}  ·  Option ${o.key}: ${o.name}`);
      o.steps.forEach(([m, txt], i) => { lines.push(`   ${hhmm(t)}  ${String(m).padStart(2)} min  ${(o.labels || [])[i] || ''}: ${txt}`); t += m; });
    });
    lines.push('', 'Slides to hide: ' + slidesToHide().join(', '));
    return lines.join('\n');
  }

  function viewPlan() {
    const days = [1, 2].map(d => {
      const rows = S.filter(s => s.day === d).map(s => {
        if (!s.options || !s.options.length) return s.minutes ? `<div class="brk"><span class="tnum">${esc(s.start)}</span><span>${esc(s.title)} · ${s.minutes} min</span></div>` : '';
        return `<div class="srow"><div class="when"><b class="tnum">${esc(s.start)}</b><span>${s.minutes} min</span></div><div>
          <div class="stitle">${esc(s.title)} <a class="small" href="#sessions/${s.id}">details</a></div>
          <div class="opts3" role="radiogroup" aria-label="${esc(s.title)}">${s.options.map(o => `
            <label class="opt ${o.key}${plan[s.id] === o.key ? ' on' : ''}"><input type="radio" name="${s.id}" value="${o.key}" ${plan[s.id] === o.key ? 'checked' : ''}>
              <span class="tk">${o.key} · ${esc(TRACK[o.key].name)}</span><b>${esc(o.name)}</b><span class="one">${esc(o.one)}</span>
              <span class="meta">${esc(o.energy)} energy${o.group ? ' · ' + esc(o.group) : ''}${usesPhones(o) ? ' · phones' : ''}</span></label>`).join('')}</div></div></div>`;
      }).join('');
      return `<div class="dayhead"><h3>${esc(dayName(d))}</h3></div>${rows}`;
    }).join('');
    $('#view').innerHTML = `
      <h2>Choose one option per session</h2>
      <p class="lead">Each session has three ways to run it, and all three meet the same objectives in the same time. Your choices set the run sheet, the materials, the slides to hide and the phone activities. The plan is saved in this browser${D.mode === 'artifact' ? '' : ' and in the link'}.</p>
      <div class="row quick" style="margin-top:12px"><button class="btn primary" data-set="rec">Recommended mix</button><button class="btn" data-set="A">All hands-on</button><button class="btn" data-set="B">All live voting</button><button class="btn" data-set="C">All real cases</button></div>
      <div class="plan-grid"><div class="card pad">${days}</div><aside class="summary" id="summary"></aside></div>
      <div class="outputs" id="outputs"></div>`;
    $$('.opt input').forEach(r => r.addEventListener('change', () => { setPlan(r.name, r.value); $$(`.opt input[name="${r.name}"]`).forEach(x => x.closest('.opt').classList.toggle('on', x.checked)); paintSummary(); paintOutputs(); }));
    $$('[data-set]').forEach(b => b.onclick = () => { withOpts.forEach(s => setPlan(s.id, b.dataset.set === 'rec' ? D.recommended[s.id] : b.dataset.set)); viewPlan(); });
    paintSummary(); paintOutputs();
  }

  function energySvg() {
    const pts = [], W = 300, H = 90, pad = 12, padL = 34;
    const list = withOpts; const step = (W - pad - padL) / (list.length - 1);
    list.forEach((s, i) => pts.push([padL + i * step, H - pad - (ENERGY[chosen(s).energy] - 1) * (H - 2 * pad) / 2, s, chosen(s)]));
    const split = list.findIndex(s => s.day === 2);
    const path = (a) => a.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
    const col = k => k === 'A' ? 'var(--tA)' : k === 'B' ? 'var(--tB)' : 'var(--tC)';
    return `<svg viewBox="0 0 ${W} ${H + 16}" role="img" aria-label="Energy across the two days">
      <line x1="${padL}" x2="${W - pad}" y1="${pad}" y2="${pad}" stroke="var(--line)" stroke-dasharray="3 3"/><line x1="${padL}" x2="${W - pad}" y1="${H / 2}" y2="${H / 2}" stroke="var(--line)" stroke-dasharray="3 3"/><line x1="${padL}" x2="${W - pad}" y1="${H - pad}" y2="${H - pad}" stroke="var(--line)" stroke-dasharray="3 3"/>
      <text x="0" y="${pad + 3}" font-size="9" fill="var(--mute)">High</text><text x="0" y="${H / 2 + 3}" font-size="9" fill="var(--mute)">Medium</text><text x="0" y="${H - pad + 3}" font-size="9" fill="var(--mute)">Calm</text>
      ${split > 0 ? `<line x1="${(pts[split - 1][0] + pts[split][0]) / 2}" x2="${(pts[split - 1][0] + pts[split][0]) / 2}" y1="4" y2="${H}" stroke="var(--mute)" stroke-width="1"/>` : ''}
      <path d="${path(pts.slice(0, split))}" fill="none" stroke="var(--ink2)" stroke-width="1.5"/><path d="${path(pts.slice(split))}" fill="none" stroke="var(--ink2)" stroke-width="1.5"/>
      ${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="${col(p[3].key)}"><title>${esc(p[2].start + ' ' + p[2].title + ': ' + p[3].name + ' (' + p[3].energy + ')')}</title></circle>`).join('')}
      <text x="${padL}" y="${H + 12}" font-size="10" fill="var(--mute)">Day 1</text><text x="${split > 0 ? (pts[split][0]) : W / 2}" y="${H + 12}" font-size="10" fill="var(--mute)">Day 2</text></svg>`;
  }
  function warnings() {
    const w = [];
    [1, 2].forEach(d => {
      const list = withOpts.filter(s => s.day === d);
      for (let i = 2; i < list.length; i++) if ([0, 1, 2].every(k => chosen(list[i - k]).energy === 'High')) w.push(`Three high-energy sessions in a row on Day ${d}, ending at ${list[i].start}. Consider a calmer option in the middle.`);
      for (let i = 2; i < list.length; i++) if ([0, 1, 2].every(k => chosen(list[i - k]).energy !== 'High' && list[i - k].minutes >= 30)) w.push(`No movement for three sessions on Day ${d}, ending at ${list[i].start}. Consider one hands-on option.`);
    });
    const after = withOpts.find(s => s.id === 'd1-decisions'); if (after && chosen(after).energy === 'Calm') w.push('The session after lunch on Day 1 is calm. Energy is usually lowest then.');
    const phones = withOpts.filter(s => (chosen(s).room || []).some(a => a !== 'parking' && !/\.check$/.test(a)));
    if (phones.length && chosen(byId['d1-arrive']).key !== 'B') w.push('You use phone activities, but Day 1 arrival is not the join-and-warm-up option. Make sure people join the room tool before ' + phones[0].start + '.');
    return w;
  }
  function paintSummary() {
    const cnt = { A: 0, B: 0, C: 0 }; withOpts.forEach(s => cnt[plan[s.id]]++);
    const n = withOpts.length, w = warnings(), hide = slidesToHide();
    const phoneN = withOpts.filter(s => usesPhones(chosen(s))).length;
    $('#summary').innerHTML = `<div class="card pad"><h3>Your mix</h3>
        <div class="mix" style="margin-top:10px">${['A', 'B', 'C'].map(k => `<div style="width:${100 * cnt[k] / n}%;background:var(--t${k})"></div>`).join('')}</div>
        <div class="legend">${['A', 'B', 'C'].map(k => `<span><i style="background:var(--t${k})"></i>${esc(TRACK[k].name)} ${cnt[k]}</span>`).join('')}</div></div>
      <div class="card pad energy"><h3>Energy across the two days</h3><div style="margin-top:8px">${energySvg()}</div></div>
      <div class="card pad"><div class="kv"><span>Sessions using phones</span><b>${phoneN} of ${n}</b></div><div class="kv"><span>Different materials</span><b>${materials().length}</b></div><div class="kv"><span>Slides to show or hide in the deck</span><b>${hideChanges().hide.length + hideChanges().unhide.length}</b></div>
        <div class="row" style="margin-top:12px"><button class="btn primary" id="cpRun">Copy run sheet</button>${D.mode === 'artifact' ? '' : '<button class="btn" id="dlRun">Download</button><button class="btn" id="cpLink">Copy plan link</button>'}</div></div>
      ${w.length ? w.map(x => `<div class="warn">${esc(x)}</div>`).join('') : '<div class="ok">The mix is balanced: no long stretches of sitting or of high energy.</div>'}`;
    $('#cpRun').onclick = () => copy(runSheetText());
    if ($('#dlRun')) $('#dlRun').onclick = () => download('workshop-run-sheet.txt', runSheetText());
    if ($('#cpLink')) $('#cpLink').onclick = () => copy(location.href.split('#')[0] + '#plan=' + planCode());
  }
  function paintOutputs() {
    let day = 0, rows = '';
    S.forEach(s => {
      if (s.day !== day) { day = s.day; rows += `<tr><td colspan="3" style="padding-top:16px"><b>${esc(dayName(day))}</b></td></tr>`; }
      if (!s.options || !s.options.length) { if (s.minutes) rows += `<tr class="brkrow"><td class="tnum">${esc(s.start)}–${esc(s.end)}</td><td colspan="2">${esc(s.title)}</td></tr>`; return; }
      const o = chosen(s); let t = toMin(s.start);
      const steps = o.steps.map(([m, txt], i) => { const r = `<span><b>${hhmm(t)}</b>${esc((o.labels || [])[i] || '')}: <span class="muted">${esc(txt)}</span></span>`; t += m; return r; }).join('');
      rows += `<tr><td class="tnum">${esc(s.start)}–${esc(s.end)}</td><td><b>${esc(s.title)}</b><br><span class="chip ${o.key}">${o.key} · ${esc(o.name)}</span></td><td><div class="steps-inline">${steps}</div></td></tr>`;
    });
    const mats = materials();
    const hide = slidesToHide();
    const acts = roomActs();
    $('#outputs').innerHTML = `
      <section class="card pad"><div class="row" style="justify-content:space-between"><h2>Run sheet</h2><span class="muted small">Times are the planned start of each step.</span></div>
        <div class="tblwrap" style="margin-top:10px"><table class="tbl"><thead><tr><th style="width:110px">Time</th><th style="width:260px">Session and option</th><th>Steps</th></tr></thead><tbody>${rows}</tbody></table></div></section>
      <section class="card pad"><h2>Materials for your plan</h2><p class="lead">Tick items as you pack. Ticks are saved in this browser.</p>
        <div class="mat" style="margin-top:12px">${mats.map(([m, ss], i) => `<label><input type="checkbox" data-mat="${esc(m)}" ${store.get('mat', {})[m] ? 'checked' : ''}><span>${esc(m)}<br><span class="ses">${ss.map(s => esc(s.start + ' ' + s.title)).join(' · ')}</span></span></label>`).join('')}</div></section>
      <section class="card pad"><h2>Slides to show and hide</h2><p class="lead">The deck comes ready for the recommended mix: the other options${hideMenus ? ' and the "Three ways to run this session" slides' : ''} are already hidden. Hidden slides are skipped in the show but still open from the Hub and Options links. For your plan:</p>
        <label class="row small" style="margin-top:10px"><input type="checkbox" id="hideMenus" ${hideMenus ? 'checked' : ''}> Keep the "Three ways to run this session" slides hidden. Participants do not need them.</label>
        ${(() => { const ch = hideChanges(); return (ch.hide.length || ch.unhide.length)
          ? `<div class="row" style="margin-top:10px;align-items:flex-start"><div style="flex:1"><div class="lbl">Unhide these slides</div><div class="slidelist">${ch.unhide.join(', ') || 'None'}</div></div><div style="flex:1"><div class="lbl">Hide these slides</div><div class="slidelist">${ch.hide.join(', ') || 'None'}</div></div></div>
             <p class="small muted" style="margin-top:8px">In PowerPoint: Slide Sorter, select the slides, right-click, Hide Slide (it switches hidden on or off).</p>`
          : '<div class="ok" style="margin-top:10px">Nothing to change: the deck already matches your plan.</div>'; })()}
        <details style="margin-top:10px"><summary class="small">Every slide your plan hides (${hide.length})</summary><div class="row" style="margin-top:8px"><div class="slidelist" style="flex:1">${hide.join(', ')}</div><button class="btn" id="cpHide">Copy</button></div></details></section>
      <section class="card pad"><h2>Phone activities in order</h2><p class="lead">Open each one from the facilitator console when its step comes. Every one has a paper fallback in its session.</p>
        <div class="tblwrap" style="margin-top:10px"><table class="tbl"><thead><tr><th style="width:110px">When</th><th>Activity</th><th>Type</th></tr></thead><tbody>
        ${acts.map(a => `<tr><td class="tnum">${esc(a.s.start)}</td><td><b>${esc(a.title)}</b> <span class="muted small">${esc(a.s.title)}</span></td><td class="muted">${esc((D.activities[a.id] || {}).type || '')}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">No phone activities in this plan.</td></tr>'}</tbody></table></div></section>`;
    $$('[data-mat]').forEach(c => c.onchange = () => { const m = store.get('mat', {}); m[c.dataset.mat] = c.checked; store.set('mat', m); });
    $('#cpHide').onclick = () => copy(hide.join(', '));
    $('#hideMenus').onchange = e => { hideMenus = e.target.checked; store.set('hideMenus', hideMenus); paintSummary(); paintOutputs(); };
  }

  /* ------------------------------------------------------------ run: the session in front of you now */
  let runId = store.get('runId', null);
  function guessSession() {
    const now = new Date(), mins = now.getHours() * 60 + now.getMinutes();
    const iso = now.toISOString().slice(0, 10);
    const day = iso === '2026-10-06' ? 1 : iso === '2026-10-07' ? 2 : null;
    if (day) { const s = withOpts.filter(x => x.day === day).find(x => mins >= toMin(x.start) && mins < toMin(x.end)); if (s) return s.id; }
    return withOpts[0].id;
  }
  function viewRun() {
    if (!runId || !byId[runId] || !(byId[runId].options || []).length) runId = guessSession();
    const s = byId[runId], o = chosen(s), log = store.get('log', {}), L = log[runId] || {};
    const idx = withOpts.findIndex(x => x.id === runId);
    let t = toMin(s.start), planned = [];
    o.steps.forEach(([m]) => { planned.push([t, t + m]); t += m; });
    const doneIdx = Object.keys(L).map(Number).filter(i => i < o.steps.length);
    const last = doneIdx.length ? Math.max(...doneIdx) : -1;
    let drift = null;
    if (last >= 0) { const d = new Date(L[last]); drift = d.getHours() * 60 + d.getMinutes() - planned[last][1]; }
    const nowStep = last + 1;
    const driftHtml = drift == null ? '<span class="drift ok">Not started</span>' : Math.abs(drift) <= 2 ? '<span class="drift ok">On plan</span>' : drift > 0 ? `<span class="drift late">${drift} min behind</span>` : `<span class="drift early">${-drift} min ahead</span>`;
    const f = s.flex || {};
    const ck = s.check;
    $('#view').innerHTML = `
      <div class="runbar"><select id="runSel" aria-label="Session">${withOpts.map(x => `<option value="${x.id}" ${x.id === runId ? 'selected' : ''}>Day ${x.day} · ${x.start} · ${esc(x.title)}</option>`).join('')}</select>
        <button class="btn" id="prev" ${idx <= 0 ? 'disabled' : ''}>◀ Back</button><button class="btn" id="next" ${idx >= withOpts.length - 1 ? 'disabled' : ''}>Next ▶</button><button class="btn" id="reset">Clear ticks</button>
        <div class="clock" id="clock"></div></div>
      <div class="run-grid">
        <div class="card pad">
          <div class="eyebrow">Day ${s.day} · ${esc(s.start)}–${esc(s.end)} · ${s.minutes} min</div>
          <h2 style="margin-top:4px">${esc(s.title)}</h2>
          <div class="optswitch">${s.options.map(x => `<button data-k="${x.key}" class="${x.key === o.key ? 'on' : ''}">${x.key} · ${esc(x.name)}</button>`).join('')}</div>
          <div class="row">${driftHtml}<span class="muted small">Tick each step when it ends; the guide works out whether you are ahead or behind.</span></div>
          <ol class="steplist">${o.steps.map(([m, txt], i) => `<li class="${L[i] ? 'done' : ''}${i === nowStep ? ' now' : ''}"><div class="t">${hhmm(planned[i][0])}<small>${m} min</small></div>
            <div><div class="lab">${esc((o.labels || [])[i] || '')}</div><div>${esc(txt)}</div></div>
            <button data-step="${i}">${L[i] ? 'Done ' + new Date(L[i]).toTimeString().slice(0, 5) : 'Done'}</button></li>`).join('')}</ol>
          ${(o.say || []).length ? `<div style="margin-top:16px"><div class="lbl">Say</div><div class="say">${o.say.map(x => `<p>“${esc(x)}”</p>`).join('')}</div></div>` : ''}
          ${(o.debrief || []).length ? `<div style="margin-top:14px"><div class="lbl">Debrief questions</div><ul class="list">${o.debrief.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
          ${ck ? `<div class="check" style="margin-top:16px"><div class="lbl">Check question</div><b>${esc(ck.q)}</b><ol type="A">${ck.options.map((x, i) => `<li${i === ck.answer ? ' class="ans"' : ''}>${esc(x)}</li>`).join('')}</ol><div class="small" style="margin-top:6px"><b>If most get it wrong:</b> ${esc(ck.if_wrong || '')}</div></div>` : ''}
          <div class="two" style="margin-top:16px"><div><div class="lbl">Materials</div><ul class="list">${(o.materials || []).map(x => `<li>${esc(x)}</li>`).join('') || '<li class="muted">None</li>'}</ul></div>
            <div><div class="lbl">Capture</div><p>${esc(o.capture || 'Nothing to capture.')}</p><div class="lbl" style="margin-top:10px">No phones?</div><p>${esc(o.paper || '')}</p></div></div>
        </div>
        <aside class="flexbox">
          <div class="flexitem"><b>Key message</b>${esc(s.key)}</div>
          <div class="flexitem"><b>By the end, people can</b><ul class="list">${s.objectives.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
          <div class="flexitem${drift != null && drift > 4 ? ' hot' : ''}"><b>Short of time</b>${esc(f.cut || '')}</div>
          <div class="flexitem${drift != null && drift < -4 ? ' hot' : ''}"><b>Ahead of time</b>${esc(f.stretch || '')}</div>
          <div class="flexitem"><b>If the room is lost</b>${esc(f.lost || '')}</div>
          <div class="flexitem"><b>Can we skip it?</b>${esc(f.skip || '')}</div>
          <div class="flexitem"><b>Comes back in</b>${esc(f.revisit || '')}</div>
          ${(s.risks || []).map(r => `<div class="flexitem"><b>Watch for</b>${esc(r[0])}<br><span class="muted">${esc(r[1])}</span></div>`).join('')}
          ${(s.words || []).length ? `<div class="flexitem"><b>New words here</b>${s.words.map(w => { const g = D.glossary.find(x => x.term.toLowerCase() === w.toLowerCase()); return `<div style="margin-top:4px"><b style="display:inline;text-transform:none;letter-spacing:0;color:var(--ink);font-size:14px">${esc(w)}</b>: ${esc(g ? g.plain : '')}</div>`; }).join('')}</div>` : ''}
        </aside>
      </div>`;
    $('#runSel').onchange = e => { runId = e.target.value; store.set('runId', runId); viewRun(); };
    $('#prev').onclick = () => { runId = withOpts[idx - 1].id; store.set('runId', runId); viewRun(); };
    $('#next').onclick = () => { runId = withOpts[idx + 1].id; store.set('runId', runId); viewRun(); };
    $('#reset').onclick = () => { const lg = store.get('log', {}); delete lg[runId]; store.set('log', lg); viewRun(); };
    $$('.optswitch button').forEach(b => b.onclick = () => { setPlan(runId, b.dataset.k); viewRun(); });
    $$('[data-step]').forEach(b => b.onclick = () => { const lg = store.get('log', {}); lg[runId] = lg[runId] || {}; const i = +b.dataset.step; if (lg[runId][i]) delete lg[runId][i]; else lg[runId][i] = Date.now(); store.set('log', lg); viewRun(); });
    const tick = () => { const c = $('#clock'); if (c) c.textContent = new Date().toTimeString().slice(0, 5); };
    tick(); clearInterval(viewRun.iv); viewRun.iv = setInterval(tick, 5000);
  }

  /* ------------------------------------------------------------ sessions in full */
  function optionFull(s, o) {
    const total = o.steps.reduce((a, b) => a + b[0], 0);
    const col = { A: 'var(--tA)', B: 'var(--tB)', C: 'var(--tC)' }[o.key];
    const acts = (o.room || []).map(a => (D.activities[a] || {}).title || a);
    return `<div class="optfull ${o.key}${plan[s.id] === o.key ? ' chosen' : ''}">
      <h4><span class="chip ${o.key}">${o.key} · ${esc(TRACK[o.key].name)}</span>${esc(o.name)}${plan[s.id] === o.key ? ' <span class="chip">in your plan</span>' : ''}</h4>
      <p>${esc(o.one)}</p>
      <div class="tl" aria-hidden="true">${o.steps.map(([m], i) => `<div style="flex:${m} 1 0;background:${col};opacity:${i % 2 ? .78 : 1}" title="${m} min · ${esc((o.labels || [])[i] || '')}">${m / total >= 0.18 ? m + '′ ' + esc((o.labels || [])[i] || '') : m + '′'}</div>`).join('')}</div>
      <div class="two"><div><div class="lbl">Steps (${total} min)</div><ol class="stepsfull">${o.steps.map(([m, t], i) => `<li><b>${m} min</b><span><b style="color:var(--ink)">${esc((o.labels || [])[i] || '')}.</b> ${esc(t)}</span></li>`).join('')}</ol></div>
        <div style="display:grid;gap:10px;align-content:start">
          <div><div class="lbl">Who and energy</div>${esc(o.group || '—')} · ${esc(o.energy)}</div>
          <div><div class="lbl">Best when</div>${esc(o.best || '')}</div>
          ${(o.materials || []).length ? `<div><div class="lbl">Materials</div>${o.materials.map(esc).join(' · ')}</div>` : ''}
          ${(o.setup || []).length ? `<div><div class="lbl">Set up before</div><ul class="list">${o.setup.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
        </div></div>
      ${(o.say || []).length ? `<div><div class="lbl">Say</div><div class="say">${o.say.map(x => `<p>“${esc(x)}”</p>`).join('')}</div></div>` : ''}
      ${(o.debrief || []).length ? `<div><div class="lbl">Debrief</div><ul class="list">${o.debrief.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      <div class="two"><div><div class="lbl">Capture</div>${esc(o.capture || '—')}</div><div><div class="lbl">Phones</div>${acts.length ? acts.map(esc).join(' · ') : 'None'}</div></div>
      <div class="two"><div><div class="lbl">No phones</div>${esc(o.paper || '—')}</div><div><div class="lbl">Remote people</div>${esc(o.remote || '—')}</div></div>
    </div>`;
  }
  function slidesOf(s) {
    const m = D.manifest.sessions[s.id]; if (!m) return '';
    const nums = m.slides.map(x => x.n); return nums.length ? `Slides ${Math.min(...nums)}–${Math.max(...nums)}` : '';
  }
  let filterDay = store.get('fday', 0);
  function viewSessions(focus) {
    const list = S.filter(s => s.minutes && (!filterDay || s.day === filterDay));
    $('#view').innerHTML = `<h2>Every session in full</h2><p class="lead">Objectives, the key message, the three options with their steps and words to say, the check question, and what to do when time runs short or the room is lost.</p>
      <div class="filters noprint"><button class="btn${!filterDay ? ' primary' : ''}" data-d="0">Both days</button><button class="btn${filterDay === 1 ? ' primary' : ''}" data-d="1">Day 1</button><button class="btn${filterDay === 2 ? ' primary' : ''}" data-d="2">Day 2</button><button class="btn" id="openAll">Open all</button></div>
      ${list.map(s => {
        const has = (s.options || []).length, f = s.flex || {};
        if (!has) return `<div class="card pad sesscard" style="display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;padding:12px 18px"><div class="tnum"><b>${esc(s.start)}</b><br><span class="muted small">${s.minutes} min · Day ${s.day}</span></div><div><b>${esc(s.title)}</b><div class="muted small">${esc(s.agenda || '')}</div></div></div>`;
        return `<details class="card sesscard" id="s-${s.id}" ${focus === s.id ? 'open' : ''}><summary><div class="when"><b class="tnum">${esc(s.start)}</b><span>${s.minutes} min · Day ${s.day}</span></div>
          <div><h3>${esc(s.title)}</h3><div class="key">${esc(s.key || '')}</div></div><span class="muted small">${esc(slidesOf(s))}</span></summary>
          <div class="sessbody">
            <div class="two"><div><div class="lbl">By the end, people can</div><ul class="list">${s.objectives.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
              <div style="display:grid;gap:10px;align-content:start"><div><div class="lbl">Agenda line, as printed</div>${esc(s.agenda || '')}</div>
              <div><div class="lbl">Understanding</div>${s.introduces ? `Moves the room to step ${s.rung_out + 1}: ${esc(D.ladder[s.rung_out].can)}` : `Stays at step ${s.rung_out + 1} and puts it to work.`}</div>
              ${(s.outputs || []).length ? `<div><div class="lbl">What the room makes</div>${s.outputs.map(esc).join(' · ')}</div>` : ''}
              ${(s.words || []).length ? `<div><div class="lbl">New words</div>${s.words.map(esc).join(' · ')}</div>` : ''}</div></div>
            ${has ? s.options.map(o => optionFull(s, o)).join('') : ''}
            ${s.check ? `<div class="check"><div class="lbl">Check question</div><b>${esc(s.check.q)}</b><ol type="A">${s.check.options.map((x, i) => `<li${i === s.check.answer ? ' class="ans"' : ''}>${esc(x)}</li>`).join('')}</ol><div class="small"><b>If most get it wrong:</b> ${esc(s.check.if_wrong || '')}</div></div>` : ''}
            ${has ? `<div class="two"><div class="flexitem"><b>Short of time</b>${esc(f.cut || '')}</div><div class="flexitem"><b>Ahead of time</b>${esc(f.stretch || '')}</div><div class="flexitem"><b>If the room is lost</b>${esc(f.lost || '')}</div><div class="flexitem"><b>Can we skip it?</b>${esc(f.skip || '')}</div></div>
              <div class="flexitem"><b>Comes back in</b>${esc(f.revisit || '')}</div>` : ''}
            ${(s.risks || []).length ? `<div><div class="lbl">Watch for</div><ul class="list">${s.risks.map(r => `<li>${esc(r[0])} <span class="muted">${esc(r[1])}</span></li>`).join('')}</ul></div>` : ''}
          </div></details>`;
      }).join('')}`;
    $$('[data-d]').forEach(b => b.onclick = () => { filterDay = +b.dataset.d; store.set('fday', filterDay); viewSessions(); });
    $('#openAll').onclick = () => $$('details.sesscard').forEach(d => d.open = true);
    if (focus) { const el = $('#s-' + focus); if (el) setTimeout(() => el.scrollIntoView({ block: 'start' }), 30); }
  }

  /* ------------------------------------------------------------ audience and thread */
  function viewAudience() {
    const gl = D.glossary.map(g => { const s = byId[g.first]; return `<div><b>${esc(g.term)}</b>${esc(g.plain)}<div class="when">First used: ${s ? esc('Day ' + s.day + ' · ' + s.start + ' · ' + s.title) : ''}</div></div>`; }).join('');
    const rungs = D.ladder.map(r => { const ss = S.filter(s => s.introduces && s.rung_out === r.rung); return `<div class="rung"><div class="n">${r.rung + 1}</div><div><b>${esc(r.short)}</b><br>${esc(r.can)}</div><div class="who">${ss.map(s => esc('Day ' + s.day + ' · ' + s.start + ' ' + s.title)).join('<br>') || (r.rung === 0 ? 'Day 1 · 09:00 Welcome' : '')}</div></div>`; }).join('');
    const c = D.case;
    const stages = c.stages.map(st => `<div><b>${st.n} · ${esc(st.name)}</b><span class="muted">The record:</span> ${esc(st.record)}<br><span class="r">Really:</span> ${esc(st.reality)}<br><span class="muted">Lesson:</span> ${esc(st.lesson)}</div>`).join('');
    const hand = S.filter(s => (s.options || []).length).map(s => `<div class="h"><div class="tnum"><b>${esc(s.start)}</b><br><span class="muted small">Day ${s.day}</span></div><div><b>${esc(s.title)}</b><br><span class="muted">${esc(s.key)}</span></div><div>${(s.outputs || []).map(esc).join('<br>')}</div></div>`).join('');
    $('#view').innerHTML = `
      <h2>Who is in the room</h2>
      <p class="lead">People from HR, staffing, resourcing, the markets, data and IT. Most are not technical. Most use AI tools a little or not at all. Nobody has built an outcome engine or broken an outcome down before. So: one idea at a time, one running example, plain words, and a check at the end of every session before moving on.</p>
      <section class="card pad" style="margin-top:18px"><h2>Eight steps of understanding</h2><p class="lead">A session either moves the room up one step, or puts the current step to work. It never jumps two. Sessions that move the room up end with a check question on that step; the others check understanding with the ladder, a quiz or a read-back. If most people get a check wrong, use the session's "if the room is lost" note before moving on.</p><div class="ladder">${rungs}</div></section>
      <section class="card pad" style="margin-top:18px"><h2>The running example: the Northgate deal</h2><p class="lead">${esc(c.id)} · ${esc(c.client)} · ${esc(c.work)} · ${esc(c.value)} · starts ${esc(c.start)} · ${esc(c.where)}. ${esc(D.meta.invented)}</p>
        <p class="lead" style="margin-top:8px"><b>${esc(c.when)}.</b> ${esc(c.frame)}</p>
        <div class="stagegrid">${(c.roles || []).map(r => `<div><b>${esc(r.id)} · ${esc(r.title)}</b><span class="muted">${esc(r.level)}</span><br>${esc(r.story)}</div>`).join('')}</div>
        <h3 style="margin-top:18px">The seven stages, record against reality</h3><div class="stagegrid">${stages}</div></section>
      <section class="card pad" style="margin-top:18px"><h2>The thread: what each session hands to the next</h2><div class="handoff">${hand}</div></section>
      <section class="card pad" style="margin-top:18px"><h2>Words, introduced one at a time</h2><p class="lead">A word appears on a slide only from the session that introduces it. The pocket guide lists them all.</p><div class="gloss">${gl}</div>
        <h3 style="margin-top:18px">Words we do not use on slides</h3><div class="banned">${D.banned.map(b => `<span>${esc(b)}</span>`).join('')}</div></section>
      <section class="card pad" style="margin-top:18px"><h2>How we work together</h2><div class="gloss">${D.room_rules.map(r => `<div><b>${esc(r[0])}</b>${esc(r[1])}</div>`).join('')}</div></section>
      <section class="card pad" style="margin-top:18px"><h2>The three tracks</h2><div class="gloss">${['A', 'B', 'C'].map(k => `<div><span class="chip ${k}">${k}</span><b style="margin-top:6px">${esc(TRACK[k].name)}</b>${esc(TRACK[k].line)}</div>`).join('')}</div></section>`;
  }

  /* ------------------------------------------------------------ room tool */
  function viewRoom() {
    const acts = withOpts.map(s => { const ids = [...new Set(s.options.flatMap(o => o.room || []))]; return ids.length ? `<tr><td class="tnum"><b>${esc(s.start)}</b><br><span class="muted small">Day ${s.day}</span></td><td><b>${esc(s.title)}</b></td><td>${ids.map(a => { const by = s.options.filter(o => (o.room || []).includes(a)).map(o => o.key).join(' '); return `${esc((D.activities[a] || {}).title || a)} <span class="muted small">(${esc((D.activities[a] || {}).type || '')}, option ${by})</span>`; }).join('<br>')}</td></tr>` : ''; }).join('');
    $('#view').innerHTML = `
      <h2>The room tool</h2>
      <p class="lead">A small web app that runs on one laptop. People scan a QR code, type their name and a four-digit PIN, and answer on their phones. The room screen shows the results live. You open, close and reveal each activity from the facilitator console. No internet and no accounts are needed.</p>
      <div class="two" style="margin-top:18px">
        <section class="card pad"><h3>Start it</h3><ol class="steps-num">
          <li><span>Copy the <b>Room tool</b> folder to the laptop that drives the projector. It needs Python 3. Check the day before: in Terminal (Mac) type <code>python3 --version</code>, or in Command Prompt (Windows) <code>py --version</code>. If it is missing, install Python 3 from python.org; that needs admin rights and the internet.</span></li>
          <li><span>Double-click <b>Start-Room.command</b> on a Mac (if the Mac refuses, right-click it and choose Open), or <b>Start-Room.bat</b> on Windows. A window opens and prints four addresses and a facilitator key. (Or run <code>python3 room.py</code> in that folder.)</span></li>
          <li><span>Open the <b>room screen</b> address in a browser on the projector, and press F for full screen.</span></li>
          <li><span>Open the <b>facilitator</b> address (it ends with your key) on your own laptop or tablet. Keep the key private.</span></li>
          <li><span>Print the QR cards from the <b>QR cards</b> address, one per table.</span></li></ol></section>
        <section class="card pad"><h3>Test the network the day before</h3><ol class="steps-num">
          <li><span>Connect the laptop and two phones to the venue Wi-Fi. Scan the code on both phones.</span></li>
          <li><span>If the phones cannot open the page, the Wi-Fi blocks devices from seeing each other. This is common on guest networks.</span></li>
          <li><span>Plan B: a travel router or a phone hotspot that the laptop and the room join.</span></li>
          <li><span>Plan C: run it on any small cloud machine and start it with <code>--url</code> set to that address.</span></li>
          <li><span>Plan D: paper. Every option has a paper version, listed in its session.</span></li></ol></section>
      </div>
      <div class="two" style="margin-top:18px">
        <section class="card pad"><h3>During the day</h3><ul class="list">
          <li><b>Open and show</b> puts an activity on the room screen and lets people answer.</li>
          <li>Check questions and the game stay hidden until you press <b>Show results</b>, so nobody copies the room.</li>
          <li>Opinion votes show live, which is part of the fun. Switch this off in Settings if the room is herding.</li>
          <li><b>Hide</b> removes any answer from the room screen. You still see it.</li>
          <li>The <b>pulse</b> tells you how many people are lost or find the pace too fast, from the last ten minutes.</li>
          <li>The <b>questions</b> panel holds the parking lot. Give each question an owner before the day ends.</li>
          <li>Someone changes phone: they type the same name and PIN. Forgot the PIN: give them a new one in People.</li></ul></section>
        <section class="card pad"><h3>After each day</h3><ul class="list">
          <li><b>Export all</b> saves every answer as one file. <b>Export CSV</b> on an activity saves just that one.</li>
          <li>Everything is also saved in <code>room-data.json</code> next to the tool, after every change. If the laptop restarts, run it again and nothing is lost.</li>
          <li>Names appear only where the room agrees a role, such as decision seats, and in game scores as first name and initial. Everything else is shown without names.</li></ul></section>
      </div>
      <section class="card pad" style="margin-top:18px"><h3>Activities by session</h3><div class="tblwrap" style="margin-top:8px"><table class="tbl"><thead><tr><th style="width:110px">When</th><th style="width:260px">Session</th><th>Phone activities</th></tr></thead><tbody>${acts}</tbody></table></div></section>`;
  }

  /* ------------------------------------------------------------ print kit */
  function viewKit() {
    const K = D.kit || [];
    $('#view').innerHTML = `<h2>Print kit</h2><p class="lead">Everything to print, what it is for and how many. The files are in the <b>Print kit</b> folder. Print in colour on A4 unless the item says otherwise.</p>
      <div class="tblwrap card pad" style="margin-top:16px"><table class="tbl"><thead><tr><th>File</th><th>What it is</th><th>Used in</th><th>How many</th></tr></thead><tbody>
      ${K.map(k => `<tr><td><b>${esc(k.file)}</b></td><td>${esc(k.what)}</td><td>${esc(k.when)}</td><td>${esc(k.qty)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">The print kit list is added when the kit is built.</td></tr>'}</tbody></table></div>`;
  }

  /* ------------------------------------------------------------ router */
  function route() {
    const h = location.hash.replace(/^#/, '') || 'plan';
    const [tab, sub] = h.split('/');
    $$('.tabs a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#' + tab ? 'page' : 'false'));
    clearInterval(viewRun.iv);
    if (tab === 'run') viewRun();
    else if (tab === 'sessions') viewSessions(sub);
    else if (tab === 'audience') viewAudience();
    else if (tab === 'room') viewRoom();
    else if (tab === 'kit') viewKit();
    else { $$('.tabs a')[0].setAttribute('aria-current', 'page'); viewPlan(); }
    if (!sub) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
